name: Apply exact reviewed recoverable branch cleanup

on:
  push:
    branches: [LiveContainerSupport]
    paths:
      - '.ci/branch-cleanup/allowlist.json'

permissions: {}
concurrency:
  group: reviewed-branch-cleanup
  cancel-in-progress: false
env:
  REVIEWED_MANIFEST_SHA256: 8ad2da13b1e15dd2429e1fce2eb1a4f22fe0eae4c56d61fbe47b98bef598a6f3

jobs:
  verify:
    if: github.event_name == 'push' && github.repository == 'NRG-Wardog/SideStore' && github.ref == 'refs/heads/LiveContainerSupport'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Checkout exact immutable reviewed workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Test cleanup safety gates without network
        run: python3 -m unittest discover -s .ci/branch-cleanup -p 'test_cleanup.py' -v
      - name: Verify exact reviewed refs, retained ancestry, and exclusions without mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .ci/branch-cleanup/cleanup.py verify

  apply:
    needs: verify
    if: github.event_name == 'push' && github.repository == 'NRG-Wardog/SideStore' && github.ref == 'refs/heads/LiveContainerSupport'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - name: Checkout same exact commit that passed read-only verification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Revalidate, dry-run leased deletion, apply once, and read back exact refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .ci/branch-cleanup/cleanup.py apply
