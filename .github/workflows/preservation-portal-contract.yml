name: Preservation portal identity contract

on:
  push:
    branches: ['validation/preservation-portal-identity-nov11', 'validation/fallback-mapping-recovery-nov13']
  pull_request:
    paths:
      - 'SideStore/Core/Auth/DeveloperPortalProxy.swift'
      - 'SideStore/Core/Operations/PipelineOperations/FetchProvisioningProfilesOperation.swift'
      - 'SideStore/Core/Operations/PipelineOperations/RefreshAppOperation.swift'
      - 'AltStore/AppDelegate.swift'
      - 'tests/preservation_refresh/**'
      - 'tests/preservation_origin/**'
      - 'tests/reuse_main/**'
      - 'tests/legacy_replacement_hooks/**'
      - 'SideStore/Core/Operations/OperationContexts.swift'
      - 'SideStore/Core/Operations/PipelineOperations/ResignAppOperation.swift'
      - 'Dependencies/SideSign'
      - '.github/workflows/preservation-portal-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preservation:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Run actual preservation fetch and refresh fixtures
        run: bash tests/preservation_refresh/run.sh
      - name: Materialize the exact SideSign gitlink for origin qualification
        run: git submodule update --init --depth 1 Dependencies/SideSign
      - name: Run actual origin transport and negative visibility fixtures
        run: bash tests/preservation_origin/run.sh
      - name: Qualify actual fallback mapping actor and wiring
        run: V3_REQUIRE_SWIFT=1 python3 -B tests/reuse_main/test_contract.py -v
      - name: Qualify actual strict signer hooks against pinned SideSign
        run: V3_REQUIRE_SWIFT=1 python3 -B tests/legacy_replacement_hooks/test_contract.py -v
      - name: Qualify actual SideSign policy and signer
        run: bash Dependencies/SideSign/.ci/reuse-main/run.sh
