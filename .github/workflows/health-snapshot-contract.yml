name: Native health snapshot contract
on:
  pull_request:
    paths:
      - AltStore/AppDelegate.swift
      - tests/health_snapshot/**
      - .github/workflows/health-snapshot-contract.yml
permissions:
  contents: read
concurrency:
  group: health-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  health-snapshot:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Require native Swift toolchain
        run: |
          command -v swiftc
          swiftc --version
      - name: Test exact production health response and wire types
        run: python3 -B -m unittest discover -s tests/health_snapshot -v
