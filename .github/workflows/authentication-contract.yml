name: Authentication diagnostic contract
on:
  workflow_dispatch:
  push:
    branches: [fix/auth-diagnostic-trim-state]
  pull_request:
    paths:
      - AltStore/AppDelegate.swift
      - tests/authentication/**
      - .github/workflows/authentication-contract.yml
permissions:
  contents: read
jobs:
  diagnostic-bounds:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - run: python3 -B -m unittest discover -s tests/authentication -v
